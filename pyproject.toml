[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "responsible-ai-toolkit"
version = "0.1.0"
description = "An open-source governance framework for deploying AI responsibly in regulated industries."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Yash Lundia", email = "yash.lundia@example.com"},
]
keywords = [
    "ai-governance",
    "responsible-ai",
    "fairness",
    "bias-detection",
    "model-risk-management",
    "compliance",
    "financial-services",
    "nist-ai-rmf",
    "audit-logging",
    "human-in-the-loop",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/rafaroger1995/responsible-ai-toolkit"
Repository = "https://github.com/rafaroger1995/responsible-ai-toolkit"
Issues = "https://github.com/rafaroger1995/responsible-ai-toolkit/issues"

[tool.setuptools.packages.find]
include = ["responsible_ai_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
